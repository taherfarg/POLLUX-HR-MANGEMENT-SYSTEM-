<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Pollux HR - people, attendance, leave and payroll for POLLUX MOTORS FZE, Dubai" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230b1324'/%3E%3Cpath d='M24 7c.9 9.6 4.2 14.7 17 17-12.8 2.3-16.1 7.4-17 17-.9-9.6-4.2-14.7-17-17 12.8-2.3 16.1-7.4 17-17Z' fill='%23f5b301'/%3E%3Ccircle cx='24' cy='24' r='3.6' fill='%230b1324'/%3E%3C/svg%3E" />
    <title>Pollux HR</title>
    <script>
      // The appearance chosen in the app (or the device's), applied before the
      // first paint so a dark-mode reload never flashes white. See useTheme.jsx.
      ;(function () {
        var dark = false
        try {
          var choice = localStorage.getItem('pollux.theme')
          dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (error) {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0d11' : '#f4f5f7')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
