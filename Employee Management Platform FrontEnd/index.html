<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Pollux HR - people, attendance, leave and payroll for POLLUX MOTORS FZE, Dubai" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pollux HR</title>
    <script>
      // The appearance chosen in the app (or the device's), applied before the
      // first paint so a dark-mode reload never flashes white. See useTheme.jsx.
      ;(function () {
        var dark = false
        try {
          var choice = localStorage.getItem('pollux.theme')
          dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (error) {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0d11' : '#f4f5f7')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
