# Render Blueprint for Pollux HR.
#
# Deploys two services from this one repository:
#   - pollux-hr-api    the Express API, built from the backend Dockerfile
#   - pollux-hr-web    the React frontend, built by Vite and served as a static site
#
# The names differ from the Matajer demo's blueprint (ems-api, ems-web) on
# purpose: both can live in one Render account, and deploying Pollux HR never
# takes over, redeploys or overwrites the Matajer services.
#
# The database is NOT defined here. Render's own Postgres expires on the free
# plan, so the database lives on Neon (free, no expiry) and is supplied through
# DATABASE_URL. See DEPLOYMENT.md for the ten-minute walkthrough.
#
# Region is singapore to match the Neon database (ap-southeast-1). Keeping the
# API and the database on the same continent matters: every request makes
# several round trips, and a cross-hemisphere hop shows up as visible lag.
#
# Apply with: Render Dashboard -> New -> Blueprint -> this repository (branch main).

services:
  - type: web
    name: pollux-hr-api
    runtime: docker
    plan: free
    region: singapore
    # Quoted because the directory name contains spaces.
    rootDir: "Employee Management Platform BackEnd"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Paste the Neon connection string here in the Render dashboard.
      # Marked sync:false so it is never committed to the repository.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and kept stable across deploys. The app refuses
      # to start in production on the development secrets, so these must be real.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 7
      # Set after the first deploy to the frontend's full origin, including the
      # scheme: https://pollux-hr-web.onrender.com
      #
      # Deliberately not wired with `fromService` - that yields a bare hostname
      # with no scheme, which would not match the browser's Origin header and
      # would fail CORS in a way that looks like a code bug.
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SEED_DEMO_PASSWORD
        sync: false
      # Optional Google AI Studio key for AI-drafted letters.
      # Leave unset and letters use the deterministic templates.
      - key: GOOGLE_API_KEY
        sync: false

  - type: web
    name: pollux-hr-web
    runtime: static
    # No `plan` here on purpose: static sites are always free and Render rejects
    # a plan field on them ("no such plan free for service type web").
    rootDir: "Employee Management Platform FrontEnd"
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time, so the frontend calls the deployed
      # API instead of the Vite dev proxy. Set after the first deploy to the
      # API's full base path: https://pollux-hr-api.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every unmatched path must return index.html so a deep
      # link or a refresh does not 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
