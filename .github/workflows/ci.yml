name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND: Employee Management Platform BackEnd
  FRONTEND: Employee Management Platform FrontEnd

jobs:
  backend:
    name: "Backend: typecheck, test, build"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: ems_local_password
          POSTGRES_DB: ems_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U ems -d ems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.BACKEND }}/package-lock.json

      - name: Install
        working-directory: ${{ env.BACKEND }}
        run: npm ci

      - name: Generate Prisma client
        working-directory: ${{ env.BACKEND }}
        run: npm run db:generate

      - name: Typecheck
        working-directory: ${{ env.BACKEND }}
        run: npm run typecheck

      # Proves the committed migration history builds the schema from empty,
      # which is what actually runs on deploy - `db push` in the test setup does not.
      - name: Migrations apply to an empty database
        working-directory: ${{ env.BACKEND }}
        env:
          DATABASE_URL: postgresql://ems:ems_local_password@localhost:5434/ems_migrations?schema=public
        run: npx prisma migrate deploy

      # The Pollux seed runs attendance, advances and payroll through the real
      # services, which validate the whole API environment - hence the CI-only
      # placeholder secrets.
      - name: Seed the migrated database
        working-directory: ${{ env.BACKEND }}
        env:
          DATABASE_URL: postgresql://ems:ems_local_password@localhost:5434/ems_migrations?schema=public
          JWT_ACCESS_SECRET: ci_only_access_secret_0123456789abcdefghij
          JWT_REFRESH_SECRET: ci_only_refresh_secret_9876543210zyxwvutsrq
          LOG_LEVEL: silent
        run: npm run db:seed

      - name: Test
        working-directory: ${{ env.BACKEND }}
        env:
          TEST_DATABASE_URL: postgresql://ems:ems_local_password@localhost:5434/ems_test?schema=public
        run: npm test

      - name: Build
        working-directory: ${{ env.BACKEND }}
        run: npm run build

  frontend:
    name: "Frontend: test, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND }}/package-lock.json

      - name: Install
        working-directory: ${{ env.FRONTEND }}
        run: npm ci

      - name: Test
        working-directory: ${{ env.FRONTEND }}
        run: npm test

      - name: Build
        working-directory: ${{ env.FRONTEND }}
        run: npm run build

  e2e:
    name: E2E acceptance (real API + real PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: ems_local_password
          POSTGRES_DB: ems
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ems -d ems"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend
        working-directory: ${{ env.BACKEND }}
        run: npm ci

      - name: Generate Prisma client
        working-directory: ${{ env.BACKEND }}
        run: npm run db:generate

      - name: Install frontend
        working-directory: ${{ env.FRONTEND }}
        run: npm ci

      - name: Install E2E deps
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # `npm test` runs prepare-db.mjs first, which migrates and seeds the
      # dedicated pollux_e2e database, then Playwright boots the API and the web
      # app itself via its `webServer` config.
      - name: Run acceptance suite
        working-directory: e2e
        env:
          CI: 'true'
          E2E_DATABASE_URL: postgresql://ems:ems_local_password@localhost:5433/pollux_e2e?schema=public
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
